info:
  name: Get Title Trophies
  type: http
  seq: 3
  tags:
    - trophies

http:
  method: GET
  url: "{{baseUrl}}/trophies/titles/:np_communication_id"
  params:
    - name: np_communication_id
      value: ""
      type: path
    - name: platform
      value: ""
      type: query
    - name: group
      value: all
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/trophies/titles/:np_communication_id"
      method: GET
      params:
        - name: np_communication_id
          value: ""
          type: path
        - name: platform
          value: ""
          type: query
        - name: group
          value: all
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "trophies": [
              {
                "trophy_id": "",
                "name": "",
                "detail": "",
                "type": "",
                "hidden": "",
                "icon_url": "",
                "earned": "",
                "earned_date": "",
                "progress_rate": "",
                "rarity": ""
              }
            ]
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/trophies/titles/:np_communication_id"
      method: GET
      params:
        - name: np_communication_id
          value: ""
          type: path
        - name: platform
          value: ""
          type: query
        - name: group
          value: all
          type: query
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }

docs: |-
  List every trophy in a title, merged with the caller's earned progress and rarity.

  :param np_communication_id: The title's ``npCommunicationId`` (from ``GET /trophies/titles``).
  :param platform: The title's platform, e.g. ``"PS5"`` or ``"PS4"`` (also from ``GET /trophies/titles``).
  :raises fastapi.HTTPException: 404, if the caller has no PSN link; 401, if PSN rejects the stored
      token.
