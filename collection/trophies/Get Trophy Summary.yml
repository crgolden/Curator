info:
  name: Get Trophy Summary
  type: http
  seq: 1
  tags:
    - trophies

http:
  method: GET
  url: "{{baseUrl}}/trophies/summary"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/trophies/summary"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "level": 0,
            "progress": 0,
            "tier": 0,
            "earned": {
              "bronze": 0,
              "silver": 0,
              "gold": 0,
              "platinum": 0
            },
            "account_id": ""
          }

docs: |-
  Return the caller's overall trophy standing (level, tier, earned counts).

  :raises fastapi.HTTPException: 404, if the caller has no PSN link; 401, if PSN rejects the stored
      token.
