info:
  name: Get Trophy Groups
  type: http
  seq: 4
  tags:
    - trophies

http:
  method: GET
  url: "{{baseUrl}}/trophies/titles/:np_communication_id/groups"
  params:
    - name: np_communication_id
      value: ""
      type: path
    - name: platform
      value: ""
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/trophies/titles/:np_communication_id/groups"
      method: GET
      params:
        - name: np_communication_id
          value: ""
          type: path
        - name: platform
          value: ""
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "title_name": "",
            "platforms": [],
            "progress": "",
            "defined": {
              "bronze": 0,
              "silver": 0,
              "gold": 0,
              "platinum": 0
            },
            "earned": {
              "bronze": 0,
              "silver": 0,
              "gold": 0,
              "platinum": 0
            },
            "groups": [
              {
                "group_id": "",
                "name": "",
                "detail": "",
                "icon_url": "",
                "progress": "",
                "defined": {
                  "bronze": 0,
                  "silver": 0,
                  "gold": 0,
                  "platinum": 0
                },
                "earned": {
                  "bronze": 0,
                  "silver": 0,
                  "gold": 0,
                  "platinum": 0
                },
                "last_updated": ""
              }
            ],
            "last_updated": ""
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/trophies/titles/:np_communication_id/groups"
      method: GET
      params:
        - name: np_communication_id
          value: ""
          type: path
        - name: platform
          value: ""
          type: query
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }

docs: |-
  Get a title's trophy-group breakdown (base game + each DLC), with the caller's earned progress.

  :param np_communication_id: The title's ``npCommunicationId`` (from ``GET /trophies/titles``).
  :param platform: The title's platform, e.g. ``"PS5"`` or ``"PS4"`` (also from ``GET /trophies/titles``).
  :raises fastapi.HTTPException: 404, if the caller has no PSN link; 401, if PSN rejects the stored
      token.
