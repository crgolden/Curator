info:
  name: Psn Unlink
  type: http
  seq: 4
  tags:
    - account

http:
  method: DELETE
  url: "{{baseUrl}}/psn/link"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/psn/link"
      method: DELETE
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""

docs: Re-verify (see :func:`curator.reverify.reverify_link`), then unlink the caller's PSN account.
