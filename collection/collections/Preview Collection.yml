info:
  name: Preview Collection
  type: http
  seq: 1
  tags:
    - collections

http:
  method: POST
  url: "{{baseUrl}}/collections/preview"
  body:
    type: json
    data: |-
      {
        "kind": "",
        "console_id": "",
        "genre_filter": [],
        "min_score": "",
        "aaa_tier_filter": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/collections/preview"
      method: POST
      body:
        type: json
        data: |-
          {
            "kind": "",
            "console_id": "",
            "genre_filter": [],
            "min_score": "",
            "aaa_tier_filter": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "included": [
              {
                "game_id": "",
                "title": "",
                "genre": "",
                "aaa_tier": "",
                "franchise": "",
                "composite_score": "",
                "rank_score": 0,
                "size_gb": 0
              }
            ],
            "excluded": [
              {
                "game_id": "",
                "title": "",
                "genre": "",
                "aaa_tier": "",
                "franchise": "",
                "composite_score": "",
                "rank_score": 0,
                "size_gb": 0
              }
            ],
            "used_gb": ""
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/collections/preview"
      method: POST
      body:
        type: json
        data: |-
          {
            "kind": "",
            "console_id": "",
            "genre_filter": [],
            "min_score": "",
            "aaa_tier_filter": ""
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }

docs: |-
  Generate a collection from an inline spec for the caller's own library, without persisting it.

  :returns: The generated :class:`CollectionPreviewResponse`.
  :raises fastapi.HTTPException: 400, if ``kind`` is invalid or (for ``"capacity_fill"``) ``console_id``
      is missing or unknown.
