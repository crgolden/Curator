info:
  name: Get Library Refresh Status
  type: http
  seq: 2
  tags:
    - library

http:
  method: GET
  url: "{{baseUrl}}/library/refresh/:run_id"
  params:
    - name: run_id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/library/refresh/:run_id"
      method: GET
      params:
        - name: run_id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "run_id": "",
            "status": "",
            "error": ""
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/library/refresh/:run_id"
      method: GET
      params:
        - name: run_id
          value: ""
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }

docs: |-
  Poll the status of a previously queued library-refresh job.

  :returns: The run's current :class:`LibraryRefreshStatusResponse`.
  :raises fastapi.HTTPException: 404, if ``run_id`` doesn't exist or isn't the caller's own run.
