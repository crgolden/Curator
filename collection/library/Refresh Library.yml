info:
  name: Refresh Library
  type: http
  seq: 1
  tags:
    - library

http:
  method: POST
  url: "{{baseUrl}}/library/refresh"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 202 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/library/refresh"
      method: POST
    response:
      status: 202
      statusText: Accepted
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "run_id": ""
          }

docs: |-
  Queue a library-refresh job for the caller's own PSN entitlements.

  :returns: The new job's run id.
  :raises fastapi.HTTPException: 503, if the job queue isn't configured on this deployment.
