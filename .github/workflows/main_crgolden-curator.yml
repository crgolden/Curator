name: Build and deploy Python app to Azure Web App - crgolden-curator

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      POSTGRES_DB: curator_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Curator
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Verify poetry.lock matches pyproject.toml
        run: poetry check --lock

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --extras dev

      - name: Ruff lint
        run: python -m ruff check src tests app.py dev_server.py

      - name: Ruff format check
        run: python -m ruff format --check src tests app.py dev_server.py

      - name: Mypy
        env:
          MYPYPATH: src
        run: python -m mypy src tests app.py dev_server.py

      - name: Run tests with coverage
        env:
          PYTHONPATH: src
          CURATOR_TEST_DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: python -m pytest --cov=src/curator --cov-report=xml:coverage.xml --cov-report=term -q

      - name: SonarCloud analysis
        if: github.actor != 'dependabot[bot]'
        uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.python.version=3.10,3.11,3.12,3.13,3.14
            -Dsonar.exclusions=**/__pycache__/**,**/*.pyc,.venv/**
            -Dsonar.scanner.skipJreProvisioning=true

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout Curator
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Assemble deployment package
        run: |
          mkdir -p publish
          cp -r src publish/src
          cp -r db publish/db
          cp pyproject.toml publish/pyproject.toml
          cp poetry.lock publish/poetry.lock
          cp app.py publish/app.py

      - name: Verify deployment package boots
        working-directory: publish
        run: |
          python -m venv /tmp/smoke-venv
          source /tmp/smoke-venv/bin/activate
          /tmp/smoke-venv/bin/python -m pip install poetry --quiet
          /tmp/smoke-venv/bin/poetry config virtualenvs.create false
          /tmp/smoke-venv/bin/poetry install --no-root
          smoke_key="$(PYTHONPATH=src /tmp/smoke-venv/bin/python -c 'from curator.persistence.crypto import TokenCrypto; print(TokenCrypto.generate_key().decode())')"
          export OIDC_AUTHORITY='https://smoke-test.invalid'
          export CURATOR_TOKEN_KEY="$smoke_key"
          export CURATOR_DATABASE_URL='postgresql://smoke:test@localhost:5432/smoke'
          /tmp/smoke-venv/bin/python -c "
          import app
          print('Smoke test OK:', app.app)
          "

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: curator-package
          path: publish/

  migrate:
    name: Migrate
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout Curator
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Verify poetry.lock matches pyproject.toml
        run: poetry check --lock

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-root

      - name: Run database migrations against the test database
        env:
          CURATOR_TEST_DATABASE_URL: ${{ secrets.CURATOR_TEST_DATABASE_URL }}
        run: python db/run_migrations.py "$CURATOR_TEST_DATABASE_URL"

      - name: Run database migrations against production
        env:
          CURATOR_DATABASE_URL: ${{ secrets.CURATOR_DATABASE_URL }}
        run: python db/run_migrations.py "$CURATOR_DATABASE_URL"

      - name: Verify secrets at rest are readable
        env:
          CURATOR_DATABASE_URL: ${{ secrets.CURATOR_DATABASE_URL }}
          CURATOR_TOKEN_KEY: ${{ secrets.CURATOR_TOKEN_KEY }}
          PYTHONPATH: src
        run: python db/reencrypt_tokens.py "$CURATOR_DATABASE_URL" --dry-run

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: migrate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: curator-package
          path: publish

      - name: Login to Azure
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_29C8B941EEC941B3B025951A74F5176F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7933356A53994B7987CBFABB49879C36 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1FCCBD0626644623AC4FF179F9E82B74 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383  # v3.0.8
        with:
          app-name: 'crgolden-curator'
          package: publish/
