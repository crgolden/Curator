[project]
name = "curator"
version = "0.1.0"
description = "A multi-user PlayStation library curator API."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = { text = "MIT" }
authors = [{ name = "crgolden" }]
keywords = ["PSN", "PlayStation", "curator", "FastAPI"]
dependencies = [
    "fastapi",
    "uvicorn",
    "joserfc",
    "cryptography",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "psycopg-pool>=3.3.1,<4.0.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0,<10.0.0",
    "redis>=8.0.1,<9.0.0",
    "azure-servicebus>=7.14.3,<8.0.0",
    "azure-identity>=1.19.0,<2.0.0",
    "aiohttp>=3.14.3,<4.0.0",
    "pycountry>=26.2.16",
    "opentelemetry-sdk>=1.44.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-psycopg>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "elasticsearch>=9.4.1,<10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "httpx2>=2.10.0,<3.0.0",
    "ruff>=0.15.22",
    "mypy>=2.3.0",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# The suite has no hot spot -- the slowest test is ~1.5 s and the slowest 25 together are under a fifth of
# the run -- so the cost is diffuse per-test overhead and parallelism is the only lever on it. `loadgroup`
# load-balances individual tests except where an `xdist_group` mark pins a set to one worker;
# `tests/test_schema.py` carries that mark because its tests share one connection holding an uncommitted
# schema build, and a second worker re-applying the same CREATE TABLEs would block on its locks. Pass
# `-n 0` to run serially when debugging -- `-p no:xdist` instead makes these very options unrecognized.
addopts = "-n auto --dist loadgroup"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT", "ERA"]
# B008 (function call in a default argument) is a real anti-pattern in general, but FastAPI's dependency
# injection is *built* on `Depends(...)` as a parameter default (see `curator.deps.require_verified_caller`,
# `curator.me_routes.me`, `curator.psn_routes.psn_link`/`psn_unlink`) -- there is no alternative spelling
# that keeps the DI working, and FastAPI's own docs use this exact shape. Ignored repo-wide rather than
# per-line `# noqa` clutter on every route handler.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["curator"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Tests intentionally use bare, unannotated fake-collaborator classes (FakeRepository, FakeConnection, ...)
# that satisfy the real collaborators' methods structurally (duck typing) rather than nominally -- matching
# this repo's no-unittest.mock fake style (see TESTING.md). Full strict-everywhere would force either
# fully-typed Protocols for every fake or scattered casts with no runtime benefit on throwaway test doubles.
# `tests/` has no `__init__.py`, so mypy names each test file's module after its bare filename
# (`test_config`, not `tests.test_config`) -- the glob below matches on that. src/ remains fully strict.
module = [
    "test_app_shim",
    "test_authz",
    "test_catalog_store_backfill",
    "test_catalog_repository",
    "test_catalog_routes",
    "test_collections_capacity_fill_strategy",
    "test_collections_console_model_defaults",
    "test_collections_filter_list_strategy",
    "test_collections_items_paging",
    "test_collections_orchestrator",
    "test_collections_repository",
    "test_collections_routes",
    "test_collections_sort_order",
    "test_console_device_links",
    "test_consoles_routes",
    "test_deps",
    "test_devices_routes",
    "test_enrichment_keys_repository",
    "test_enrichment_keys_routes",
    "test_enrichment_opencritic_client",
    "test_enrichment_rawg_client",
    "test_enrichment_routes",
    "test_filter_predicate",
    "test_config",
    "test_connection",
    "test_crypto",
    "test_db_token_store",
    "test_library_manual_entries",
    "test_library_repository",
    "test_library_routes",
    "test_jobs_queue_depth_monitor",
    "test_jobs_queue_publisher",
    "test_jobs_repository",
    "test_identity_routes",
    "test_link_service",
    "test_measured_sizes_routes",
    "test_preferences_routes",
    "test_presence_routes",
    "test_profile_persistence",
    "test_profile_routes",
    "test_public_collections_routes",
    "test_psn_account_client",
    "test_psn_identifiers",
    "test_psn_mutation_service",
    "test_psn_npsso",
    "test_psn_presence_client",
    "test_psn_rate_limiter",
    "test_psn_repository",
    "test_redis_client",
    "test_refresh_schedules",
    "test_trophy_routes",
    "test_psn_safety",
    "test_psn_session",
    "test_psn_store_client",
    "test_psn_social_client",
    "test_psn_trophy_cache",
    "test_psn_trophy_client",
    "test_repository",
    "test_reverify",
    "test_scoring_scoring_service",
    "test_scoring_size_estimation_service",
    "test_routes",
    "test_social_routes",
    "test_storage_devices_routes",
    "test_schema",
    "test_settings",
    "test_telemetry",
    "test_token_validation",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disable_error_code = ["arg-type", "type-arg"]
